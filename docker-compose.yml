services:
  postgres:
    image: postgres:16-alpine
    container_name: pindodo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pindodo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pindodo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pindodo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pindodo} -d ${POSTGRES_DB:-pindodo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pindodo-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pindodo-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pindodo:pindodo_dev_password@postgres:5432/pindodo
      DATABASE_URL_SYNC: postgresql://pindodo:pindodo_dev_password@postgres:5432/pindodo
      REDIS_URL: redis://redis:6379/0
      BACKEND_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             python -m seed.seed_data &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pindodo-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pindodo:pindodo_dev_password@postgres:5432/pindodo
      DATABASE_URL_SYNC: postgresql://pindodo:pindodo_dev_password@postgres:5432/pindodo
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
    command: python -m app.workers.runner

  customer-web:
    build:
      context: ./apps/customer-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    container_name: pindodo-customer
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "${CUSTOMER_WEB_PORT:-3000}:3000"
    depends_on:
      - backend

  admin-dashboard:
    build:
      context: ./apps/admin-dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
        NEXT_PUBLIC_APP_URL: http://localhost:3001
    container_name: pindodo-admin
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      PORT: 3001
    ports:
      - "${ADMIN_WEB_PORT:-3001}:3001"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: pindodo-nginx
    profiles: ["with-nginx"]
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - customer-web
      - admin-dashboard

volumes:
  postgres_data:
  redis_data:
